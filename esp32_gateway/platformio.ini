; ============================================================================
;  ESP32-C6 Gateway (ESP-IDF framework)
;
;  The official espressif32 platform in the PlatformIO registry lists only
;  the espidf framework for the ESP32-C6 board definition (Arduino is not
;  listed). Therefore, the pioarduino fork was previously required to use
;  the Arduino framework. However, the official registry works fine for
;  this configuration because it uses the espidf framework.
; ============================================================================

[env:esp32-c6-devkitc-1]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200

board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304

board_build.partitions = partitions.csv

; The ESP32-C6 has built-in USB Serial/JTAG, so no additional hardware is required
upload_protocol = esptool
debug_tool = esp-builtin

; When using the espidf framework, `pio device monitor` automatically uses
; the ESP-IDF-provided idf_monitor to decode backtraces.
; Therefore, the esp32_exception_decoder monitor filter used with the
; Arduino framework is not required.