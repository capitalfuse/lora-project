; ============================================================================
;  STM32F103C8 + DX-LR30 (SX1262) Mesh Sensor/Repeater/Gateway/Actuator Network
;  Build environments:
;    - bluepill_cli         : Original interactive LoRa CLI tool (functional testing and RF tuning)
;    - bluepill_lse_test    : Minimal diagnostic build for verifying LSE oscillator operation
;    - bluepill_mesh        : Integrated Node/Repeater/Gateway/Actuator firmware (production deployment)
;    - bluepill_mesh_release : Final deployment build for use after Node operation is stable (debug output disabled)
;    - bluepill_mesh_debug  : SWD debugging build for VSCode (requires an SWD probe)
;
;  All devices (Node/Repeater/Gateway/Actuator) use the same STM32F103C8 Blue Pill
;  board and the same firmware (bluepill_mesh). The device role is determined
;  automatically based on wiring, jumpers (PB0/PB1), and ESP32 presence.
; ============================================================================

[platformio]
default_envs = bluepill_mesh

[env]
platform = ststm32
; The actual chip is a 128 KB variant (equivalent to STM32F103CB).
; This is accommodated by explicitly specifying board_build.mcu and
; board_upload.maximum_size while retaining genericSTM32F103C8.
board = genericSTM32F103C8
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; Firmware upload via the UART bootloader. If an automatic upload circuit
; is available (automatically switching BOOT0/RESET via RTS/DTR), the
; rts/dtr settings in upload_flags will be applied.
; When using manual BOOT0 jumper switching for uploads, upload_flags may
; be ignored or may not work as expected. In that case, this line and
; upload_flags can be removed.
upload_protocol = serial

; --- Shared libraries ---
; The official package names in the PlatformIO Library Registry are
; "STM32duino Low Power" and "STM32duino RTC" (with spaces).
; Specifying "stm32duino/STM32LowPower" does not resolve as a registry
; package and results in UnknownPackageError.
; In addition, some registry versions have reported build issues on
; Blue Pill (STM32F1) targets, such as 'LowPower_init' was not declared.
; These issues are resolved by specifying the GitHub repositories directly.
lib_deps =
    https://github.com/stm32duino/STM32LowPower.git
    https://github.com/stm32duino/STM32RTC.git

; With the genericSTM32F103C8 variant, the build system automatically
; detects Serial2 usage in the source code and enables ENABLE_HWSERIAL2
; internally. Defining it explicitly causes a duplicate definition.
; Serial1 (numbered) is not detected automatically, so it must be enabled
; explicitly.
; (This asymmetric behavior does not occur with the bluepill_f103c8 variant.)
build_flags =
    -D HAL_UART_MODULE_ENABLED
    -D ENABLE_HWSERIAL1
    -D ENABLE_HWSERIAL3

; ----------------------------------------------------------------------------
; CLI debug build: Uses the original main.cpp implementation (cli_main.cpp)
; Used for RF configuration tuning, measured ToA, sniff/scan, and other tests.
; ----------------------------------------------------------------------------
[env:bluepill_cli]
extends = env
build_src_filter = +<cli_main.cpp> -<mesh_main.cpp> -<lse_test.cpp>

; ----------------------------------------------------------------------------
; Minimal diagnostic build for verifying LSE oscillator operation
; ----------------------------------------------------------------------------
[env:bluepill_lse_test]
extends = env
build_src_filter = +<lse_test.cpp> -<mesh_main.cpp> -<cli_main.cpp>

; ----------------------------------------------------------------------------
; Production mesh build: Integrated Node/Repeater/Gateway/Actuator firmware
; ----------------------------------------------------------------------------
[env:bluepill_mesh]
extends = env
build_src_filter = +<mesh_main.cpp> -<cli_main.cpp> -<lse_test.cpp>
; Keep debug output enabled until hardware tuning is complete,
; including adjustment of BMI160 interrupt thresholds.
build_flags =
    ${env.build_flags}
    -DMESH_DEBUG_SERIAL=1

; ----------------------------------------------------------------------------
; Mesh release build: Final deployment after Node operation is stable
;   - With MESH_DEBUG_SERIAL=0, no Serial1-related calls or waits are performed.
;     Use this build when minimizing power consumption for battery-powered Nodes.
;   - Repeaters, Gateways, and Actuators are assumed to be continuously powered,
;     so using bluepill_mesh for these devices is sufficient.
; ----------------------------------------------------------------------------
[env:bluepill_mesh_release]
extends = env
build_src_filter = +<mesh_main.cpp> -<cli_main.cpp> -<lse_test.cpp>
build_flags =
    ${env.build_flags}
    -DMESH_DEBUG_SERIAL=0

; ----------------------------------------------------------------------------
; Mesh debug build: For SWD debugging in VSCode
;   Note: A separate SWD debugging probe, such as ST-Link, is required.
;   - Reduce optimization and retain debug symbols (-Og -g3).
;   - Disable entry into STOP-mode sleep to prevent the debugger connection
;     from being lost.
; ----------------------------------------------------------------------------
[env:bluepill_mesh_debug]
extends = env:bluepill_mesh
upload_protocol = stlink   ; Use ST-Link for firmware uploads during debugging.
build_flags =
    ${env:bluepill_mesh.build_flags}
    -DDISABLE_LOW_POWER_SLEEP
    -Og
    -g3
debug_tool = stlink
debug_init_break = tbreak setup   ; Automatically break at the beginning of setup().